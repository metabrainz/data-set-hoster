[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "datasethoster"
version = "0.1"
description = "Super simple data set hoster"
license = { text = "GPL2" }
authors = [{ name = "Robert Kaye", email = "rob@metabrainz.org" }]
urls = { Homepage = "https://github.com/metabrainz/data-set-hoster" }
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1.3",
    "pydantic>=2.0",
    "sentry-sdk[flask]>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["datasethoster*"]

[tool.setuptools.package-data]
datasethoster = ["template/*.html"]
